<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN2EN v2.9 — 搜狗布局 × 朱砂配色</title>
<style>
:root{
  --void:#07080a;      /* 玄墨底 */
  --kb:#1b1d21;        /* 键盘面板底 */
  --panel:#2b2d32;     /* 面板/浮层底 */
  --key:#3f4249;       /* 键帽 */
  --fn:#33363c;        /* 功能键帽 */
  --zhu:#e0453a;       /* 朱砂主色 */
  --ci:#4ad295;        /* 青瓷 */
  --txt:#f4f5f7;
  --dim:#9aa0a8;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC','Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;padding:30px;display:flex;gap:36px;flex-wrap:wrap}
.phone{width:390px;flex-shrink:0}
.ptitle{color:var(--dim);font-size:13px;text-align:center;margin-bottom:10px}
.screen{width:390px;height:800px;background:var(--void);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;position:relative}

/* ── App 区(仿真Messenger) ── */
.chatpad{flex:1;padding-top:26px}
.bubble{margin:0 16px 10px;align-self:flex-start;max-width:250px;background:#2c2e33;color:var(--txt);font-size:15px;padding:11px 14px;border-radius:18px 18px 18px 4px;width:max-content;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.appbar{display:flex;align-items:center;gap:9px;padding:10px 12px 14px}
.aico{color:#0a84ff;display:flex}
.aico svg{width:25px;height:25px}
.aarrow{color:#0a84ff;display:flex}
.aarrow svg{width:22px;height:22px}
.afield{flex:1;background:#1c1e22;border-radius:19px;height:38px;padding:0 13px;display:flex;align-items:center;gap:8px}
.afield .ph{color:#7d838d;font-size:16px}
.afield .en{color:var(--ci);font-size:16px;display:flex;align-items:center}
.afield .caret{display:inline-block;width:2px;height:18px;background:var(--ci);margin-left:1px}
.afield .face{margin-left:auto;color:#0a84ff;display:flex}
.afield .face svg{width:22px;height:22px}
.amenu{color:#0a84ff;display:flex}
.amenu svg{width:26px;height:26px}
.asend{width:34px;height:34px;border-radius:50%;background:var(--zhu);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.asend svg{width:17px;height:17px}

/* ── 键盘外壳 ── */
.kb{background:var(--kb);position:relative;display:flex;flex-direction:column}
.kbmain{position:relative;overflow:hidden}
.iosbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#e6e9ee;flex-shrink:0}
.iosbar svg{width:23px;height:23px}
.mrow{height:27px;display:flex;justify-content:flex-end;align-items:center;padding:0 11px}

/* 工具条 7 圆钮 */
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:1px 13px 7px}
.tico{width:27px;height:27px;border-radius:50%;background:#2f3136;display:flex;align-items:center;justify-content:center;color:#c9ced5;flex-shrink:0}
.tico svg{width:16px;height:16px}
.tico.logo .slogo{font-size:20px;font-weight:800;font-style:italic;line-height:1;background:linear-gradient(160deg,#f2825f,var(--zhu));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px;transform:translateY(-1px)}
.tico.tactive{position:relative}
.tico.tactive::after{content:'✓';position:absolute;bottom:-3px;right:-3px;background:var(--zhu);color:#fff;font-size:8px;line-height:1;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--kb)}

/* 翻译条 */
.tbar{display:flex;align-items:center;gap:9px;padding:9px 12px 5px;height:42px}
.pill{background:var(--zhu);color:#fff;font-size:12.5px;font-weight:600;height:26px;padding:0 10px;border-radius:13px;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.pill i{font-style:normal;font-size:9px;opacity:.9;transform:translateY(1px)}
.tfield{flex:1;background:var(--panel);border-radius:10px;height:30px;padding:0 11px;font-size:14.5px;color:var(--txt);display:flex;align-items:center;min-width:0;overflow:hidden}
.tfield .caret{display:inline-block;width:1.5px;height:16px;background:#dfe3e8;margin-right:3px;flex-shrink:0}
.tfield .ph{color:#8a9099;white-space:nowrap}
.tfield .clr{margin-left:auto;color:var(--dim);font-size:15px;line-height:1;padding-left:8px}
.ticoA{color:#d3d7dd;display:flex;flex-shrink:0}
.ticoA svg{width:21px;height:21px}
.tcancel{color:var(--txt);font-size:15.5px;flex-shrink:0}
.tok{color:#fff;font-size:15.5px;font-weight:700;flex-shrink:0}

/* 候选条 */
.cands{display:flex;align-items:stretch;height:42px;padding:0 6px;overflow:hidden;margin-bottom:3px}
.cand{color:#fff;font-size:18px;display:flex;align-items:center;padding:0 12px;white-space:nowrap;flex-shrink:0}
.cand + .cand{border-left:1px solid rgba(255,255,255,.09)}
.cand.dim{color:#cdd2d8}
.cand.x{margin-left:auto;color:#c9ced5;font-size:16px}

/* 九宫格 */
.grid9{display:grid;grid-template-columns:59fr 78fr 78fr 78fr 57fr;grid-auto-rows:50px;gap:6px 7px;padding:0 3px}
.k{background:var(--key);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.k b{font-weight:400;font-size:20px;letter-spacing:.5px}
.k small{position:absolute;top:4px;right:7px;font-size:11px;color:var(--dim);line-height:1}
.k.punccol{grid-row:1/4;flex-direction:column;justify-content:stretch;align-items:stretch;padding:0}
.pc{flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;color:#f0f2f5}
.pc + .pc{border-top:1px solid rgba(0,0,0,.32);margin:0 5px}
.k.fn{background:var(--fn)}
.k.fn.sm{font-size:14px}
.k.fn.md{font-size:15px}
.k.fn.lg{font-size:18px}
.k.sp{color:#b8bdc4}
.k.sp svg{width:20px;height:20px}
.cnkey{flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.2;font-size:11.5px;padding:0 9px;gap:1px}
.cnkey .zh{color:var(--txt);display:flex;align-items:center}
.cnkey .zh::after{content:'';width:4px;height:4px;border-top:1px solid var(--dim);border-right:1px solid var(--dim);margin-left:2px}
.cnkey .en{color:var(--dim);align-self:flex-end;display:flex;align-items:center}
.cnkey .en::before{content:'';width:4px;height:4px;border-bottom:1px solid var(--dim);border-left:1px solid var(--dim);margin-right:2px}
.rowb{display:grid;grid-template-columns:59fr 47fr 122fr 49fr 77fr;grid-auto-rows:50px;gap:7px;margin-top:6px;padding:0 3px}

/* QWERTY */
.qw{padding:0 3px}
.qrow{display:grid;gap:6px;margin-bottom:12px}
.q1{grid-template-columns:repeat(10,1fr)}
.q2{grid-template-columns:repeat(9,1fr);padding:0 14px}
.q3{grid-template-columns:1.35fr repeat(7,1fr) 1.5fr}
.qk{background:var(--key);border-radius:7px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.qk small{position:absolute;top:3px;right:5px;font-size:10px;color:var(--dim);line-height:1}
.qk.fn{background:var(--fn);color:#dfe3e8}
.qk.fn svg{width:22px;height:22px}
.qw .rowb{grid-template-columns:59fr 47fr 44fr 96fr 49fr 77fr}
.qmark{flex-direction:column;line-height:1.05;font-size:13px;gap:1px}

/* 语种面板 */
.lang{position:relative;background:var(--panel)}
.lhead{position:relative;height:44px;display:flex;align-items:center;justify-content:center}
.lhead b{color:var(--txt);font-size:15.5px;font-weight:600}
.lhead .done{position:absolute;right:14px;color:var(--zhu);font-size:15.5px}
.lrow{height:44px;display:flex;align-items:center;padding:0 14px 0 17px;border-top:1px solid rgba(0,0,0,.35);color:var(--txt);font-size:15.5px}
.lrow .t{flex:1;min-width:0}
.lrow small{display:block;color:#8a9099;font-size:11px;margin-top:2px}
.lrow .ck{color:var(--zhu);font-size:17px;font-weight:700}
</style>
</head>
<body>
<div id="stage" style="display:flex;gap:36px;flex-wrap:wrap"></div>

<script>
/* ───── 图标 ───── */
var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
var I={
 camera:S+'<path d="M3 8.6A2.6 2.6 0 0 1 5.6 6h1.5l1.3-1.9h7.2L16.9 6h1.5A2.6 2.6 0 0 1 21 8.6v7.8a2.6 2.6 0 0 1-2.6 2.6H5.6A2.6 2.6 0 0 1 3 16.4z"/><circle cx="12" cy="12.4" r="3.4"/></svg>',
 photo:S+'<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.6" cy="9.4" r="1.6"/><path d="M4 17.2l4.5-4.5 3.2 3.2 3-3L20 17.2"/></svg>',
 mic:S+'<rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.8a6.5 6.5 0 0 0 13 0M12 18.3V21"/></svg>',
 doc:S+'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
 smile:S+'<circle cx="10.5" cy="12.5" r="7.8"/><path d="M7.8 11h.01M13.2 11h.01M7.6 15c.8 1 1.8 1.6 2.9 1.6s2.1-.6 2.9-1.6"/><path d="M18.6 3.2v4.4M16.4 5.4h4.4"/></svg>',
 keys:S+'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M6.5 12.5h.01M10 12.5h.01M13.5 12.5h.01M17 12.5h.01M8 15.4h8"/></svg>',
 trans:S+'<text x="3" y="10" font-size="9" font-weight="600" fill="currentColor" stroke="none">文</text><text x="13.5" y="20.5" font-size="9.5" fill="currentColor" stroke="none">A</text><path d="M13 4.5h6.2M17.4 2.4l2.2 2.1-2.2 2.1" stroke-width="1.5"/></svg>',
 find:S+'<circle cx="11" cy="11" r="6.6"/><path d="M15.9 15.9 20.4 20.4"/></svg>',
 down:S+'<path d="M6 9.5l6 6 6-6"/></svg>',
 globe:S+'<circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.5 2.4 3.8 5.3 3.8 8.6s-1.3 6.2-3.8 8.6c-2.5-2.4-3.8-5.3-3.8-8.6S9.5 5.8 12 3.4z"/></svg>',
 imic:S+'<rect x="9" y="2.6" width="6" height="12" rx="3"/><path d="M5.2 11.6a6.8 6.8 0 0 0 13.6 0M12 18.6v2.8"/></svg>',
 del:S+'<path d="M8.6 5.2h10.8A1.6 1.6 0 0 1 21 6.8v10.4a1.6 1.6 0 0 1-1.6 1.6H8.6L3.2 12z"/><path d="M11.6 9.6l4.8 4.8M16.4 9.6l-4.8 4.8"/></svg>',
 shift:S+'<path d="M12 3.8l7.2 7.4h-4.2v6.4H9v-6.4H4.8z"/></svg>',
 menu:S+'<path d="M4 7h16M4 12h16M4 17h16" stroke-width="2"/></svg>',
 send:S+'<path d="M3.6 11.4 20.4 4l-6.2 16.4-2.6-6.6z"/><path d="M11.6 13.8 20.4 4" stroke-width="1.4"/></svg>',
 back:S+'<path d="M14.5 5.5 8 12l6.5 6.5M8 12h12" stroke-width="2"/>',
 mascot:'<svg viewBox="0 0 32 32"><path d="M7 11C7 6.5 8.6 3.4 10.4 3.4c1.5 0 2.5 1.7 2.9 4.2" fill="#e0453a"/><path d="M25 11c0-4.5-1.6-7.6-3.4-7.6-1.5 0-2.5 1.7-2.9 4.2" fill="#e0453a"/><ellipse cx="16" cy="18.4" rx="10.6" ry="9.6" fill="#f7f8fa"/><circle cx="11.8" cy="17.4" r="1.9" fill="#2a2c31"/><circle cx="20.2" cy="17.4" r="1.9" fill="#2a2c31"/><path d="M12.2 22.4c1.1 1.1 2.4 1.7 3.8 1.7s2.7-.6 3.8-1.7" stroke="#2a2c31" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M8.4 26.2c2 2.4 4.6 3.6 7.6 3.6s5.6-1.2 7.6-3.6z" fill="#e0453a"/></svg>'
};

/* ───── 部件 ───── */
function mascotRow(){return '<div class="mrow"><span style="width:25px;height:25px;display:flex">'+I.mascot+'</span></div>'}
function toolbar(active,goA,goB){
  var t=[];
  t.push('<div class="tico logo"><span class="slogo">S</span></div>');
  t.push('<div class="tico">'+I.smile+'</div>');
  t.push('<div class="tico">'+I.mic+'</div>');
  t.push('<div class="tico">'+I.keys+'</div>');
  t.push('<div class="tico" onclick="go(\''+(active?(goA||'t9'):'tr')+'\')">'+I.trans+'</div>');
  t.push('<div class="tico">'+I.find+'</div>');
  t.push('<div class="tico">'+I.down+'</div>');
  return '<div class="toolbar">'+t.join('')+'</div>';
}
function tbar(mode){
  if(mode==='empty')
    return '<div class="tbar"><span class="pill">中⇄英<i>▾</i></span><div class="tfield"><span class="caret"></span><span class="ph">输入要翻译的中/英文</span></div><span class="ticoA">'+I.trans+'</span><span class="tcancel" onclick="go(CANCEL)">取消</span></div>';
  return '<div class="tbar"><span class="pill" onclick="go(\'lg\')">中⇄英<i>▾</i></span><div class="tfield"><span>真的是</span><span class="clr">✕</span></div><span class="tok" onclick="go(\'res\')">确定</span></div>';
}
function cands(){
  return '<div class="cands"><span class="cand">个</span><span class="cand">我</span><span class="cand">😊真的是</span><span class="cand dim">哈哈哈</span><span class="cand dim">你</span><span class="cand x">✕</span></div>';
}
function grid9(){
  var g=[];
  g.push('<div class="grid9">');
  g.push('<div class="k punccol"><span class="pc">,</span><span class="pc">。</span><span class="pc">?</span><span class="pc">!</span></div>');
  g.push('<div class="k"><b>@/.</b><small>1</small></div><div class="k"><b>ABC</b><small>2</small></div><div class="k"><b>DEF</b><small>3</small></div><div class="k fn">'+I.del.replace('<svg','<svg style="width:23px;height:23px"')+'</div>');
  g.push('<div class="k"><b>GHI</b><small>4</small></div><div class="k"><b>JKL</b><small>5</small></div><div class="k"><b>MNO</b><small>6</small></div><div class="k fn md">重输</div>');
  g.push('<div class="k"><b>PQRS</b><small>7</small></div><div class="k"><b>TUV</b><small>8</small></div><div class="k"><b>WXYZ</b><small>9</small></div><div class="k fn lg"><b>0</b></div>');
  g.push('</div>');
  return g.join('');
}
function rowbT9(){
  return '<div class="rowb"><div class="k fn sm">符</div><div class="k fn lg">123</div><div class="k fn sp">'+I.imic+'</div><div class="k fn cnkey"><span class="zh">中</span><span class="en">英</span></div><div class="k fn sm">换行</div></div>';
}
function qwerty(){
  var r1='QWERTYUIOP',r2='ASDFGHJKL',r3='ZXCVBNM',h='';
  h+='<div class="qw"><div class="qrow q1">';
  for(var i=0;i<10;i++)h+='<div class="qk">'+r1[i]+'<small>'+(i+1)%10+'</small></div>';
  h+='</div><div class="qrow q2">';
  for(var j=0;j<9;j++)h+='<div class="qk">'+r2[j]+'</div>';
  h+='</div><div class="qrow q3"><div class="qk fn">'+I.shift+'</div>';
  for(var k2=0;k2<7;k2++)h+='<div class="qk">'+r3[k2]+'</div>';
  h+='<div class="qk fn">'+I.del.replace('<svg','<svg style="width:21px;height:21px"')+'</div></div>';
  h+='<div class="rowb"><div class="k fn sm">符</div><div class="k fn lg">123</div><div class="k fn qmark"><span>’</span><span>。</span></div><div class="k sp" style="background:var(--key)"><span style="display:block;width:34px;height:5px;border-radius:3px;background:#8a9099"></span></div><div class="k fn cnkey"><span class="zh">中</span><span class="en">英</span></div><div class="k fn sm">换行</div></div></div>';
  return h;
}
function iosbar(){return '<div class="iosbar"><span>'+I.globe+'</span><span>'+I.imic+'</span></div>'}
function langPanel(){
  var rows=[['自动检测','中文译成英文，其他语言译成中文',''],['中英互译','','✓'],['中日互译','',''],['中韩互译','',''],['中法互译','',''],['中德互译','',''],['中俄互译','','']];
  var h='<div class="lang"><div class="lhead"><b>语种选择</b><span class="done" onclick="go(\'ty\')">完成</span></div>';
  rows.forEach(function(r){
    h+='<div class="lrow"><span class="t">'+r[0]+(r[1]?'<small>'+r[1]+'</small>':'')+'</span>'+(r[2]?'<span class="ck">✓</span>':'')+'</div>';
  });
  return h+'</div>';
}
function appbar(kind){
  if(kind==='res')
    return '<div class="appbar"><span class="aarrow">'+I.back+'</span><div class="afield"><span class="en">Really?<span class="caret"></span></span></div><span class="asend">'+I.send+'</span></div>';
  return '<div class="appbar"><span class="aico">'+I.camera+'</span><span class="aico">'+I.photo+'</span><span class="aico">'+I.mic+'</span><span class="aico">'+I.doc+'</span><div class="afield"><span class="ph">Aa</span><span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.8 10h.01M15.2 10h.01M8.4 14.4c1 1.2 2.2 1.8 3.6 1.8s2.6-.6 3.6-1.8"/></svg></span></div><span class="amenu">'+I.menu+'</span></div>';
}
function chat(){return '<div class="chatpad"><div class="bubble">Hi sir</div></div>'}

/* ───── 七态 ───── */
var CANCEL='t9';
function kb(inner,h){return '<div class="kb"'+(h?' style="height:'+h+'px"':'')+'>'+inner+iosbar()+'</div>'}
var STATES={
 t9:{label:'01 正常九键 · 待机',html:function(){return chat()+appbar()+kb(mascotRow()+toolbar(false)+grid9()+rowbT9())}},
 tr:{label:'02 翻译模式 · 空(九键)',html:function(){CANCEL='t9';return chat()+appbar()+kb(tbar('empty')+mascotRow()+toolbar(true,'t9')+grid9()+rowbT9())}},
 ty:{label:'03 输入中文 · 候选',html:function(){return chat()+appbar()+kb(tbar('text')+mascotRow()+cands()+grid9()+rowbT9())}},
 res:{label:'04 确定 · 译文进输入框',html:function(){return chat()+appbar('res')+kb(tbar('text')+mascotRow()+toolbar(true,'t9')+grid9()+rowbT9())}},
 lg:{label:'05 语种选择面板',html:function(){return chat()+appbar()+kb(langPanel())}},
 qt:{label:'06 翻译模式 · 全键盘',html:function(){CANCEL='qw';return chat()+appbar()+kb(tbar('empty')+mascotRow()+toolbar(true,'qw')+qwerty())}},
 qw:{label:'07 正常全键盘 · 待机',html:function(){return chat()+appbar()+kb(mascotRow()+toolbar(false)+qwerty())}}
};

/* ───── hash 路由 ───── */
function go(s){location.hash=s;render()}
function render(){
  var h=(location.hash||'#t9').slice(1);
  var st=STATES[h]||STATES.t9;
  document.getElementById('stage').innerHTML=
    '<div class="phone"><div class="ptitle">'+st.label+'</div><div class="screen">'+st.html()+'</div></div>';
}
window.onload=render;
window.onhashchange=render;
</script>
</body>
</html>
